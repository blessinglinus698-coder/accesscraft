# Full AccessCraft stack: React frontend (nginx) + Express/Puppeteer API.
#
#   docker compose up --build
#
# Frontend: http://localhost:8080   API: http://localhost:5000/api/health
# Copy .env.example to .env to override ports and settings.

name: accesscraft

services:
  backend:
    build:
      context: ./backend
    image: accesscraft-backend:local
    init: true # reap zombie Chrome processes
    restart: unless-stopped
    environment:
      PORT: "5000"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    shm_size: "1gb" # Chrome crashes with the default 64mb /dev/shm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: accesscraft-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
