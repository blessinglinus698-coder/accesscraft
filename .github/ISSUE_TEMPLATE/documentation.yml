name: Documentation
description: Report missing, unclear or incorrect documentation
title: "docs: "
labels: ["type: docs", "status: needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where is the problem?
      description: File path, README section or link.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to submit a pull request for this
