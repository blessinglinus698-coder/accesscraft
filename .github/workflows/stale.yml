name: Stale

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close inactive issues and PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: "status: stale"
          stale-pr-label: "status: stale"
          exempt-issue-labels: "status: pinned,status: confirmed,priority: high,type: security,help wanted,good first issue"
          exempt-pr-labels: "status: pinned,status: blocked,type: security"
          exempt-all-milestones: true
          stale-issue-message: >
            This issue has had no activity for 60 days and is marked stale.
            It will be closed in 14 days unless there is new activity.
            Comment to keep it open.
          stale-pr-message: >
            This pull request has had no activity for 60 days and is marked stale.
            It will be closed in 14 days unless there is new activity.
          close-issue-message: Closing due to inactivity. Feel free to reopen with new information.
          close-pr-message: Closing due to inactivity. Feel free to reopen when you are ready to continue.
